name: Mutation Testing
on: push

jobs:
  pitest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build all modules first
        run: mvn -q -DskipTests install

      - name: Run mutation tests and capture score
        id: extract
        run: |
          mvn -B -pl core org.pitest:pitest-maven:mutationCoverage -DoutputFormats=XML,HTML 2>&1 | tee pit-output.log
          SCORE=$(grep -oP "Generated \d+ mutations Killed \d+ \(\K\d+(?=%\))" pit-output.log || echo "0")
          echo "score=$SCORE" >> $GITHUB_OUTPUT
          echo "Mutation score: $SCORE%"
      
      - name: Read previous score
        id: previous
        run: |
          if [ -f .github/mutation-score.txt ]; then
            PREVIOUS=$(cat .github/mutation-score.txt)
            echo "previous=$PREVIOUS" >> $GITHUB_OUTPUT
            echo "Previous score: $PREVIOUS%"
          else
            echo "previous=0" >> $GITHUB_OUTPUT
            echo "No previous score found"
          fi

      - name: Compare scores
        run: |
          CURRENT=${{ steps.extract.outputs.score }}
          PREVIOUS=${{ steps.previous.outputs.previous }}
          
          echo "Previous score: $PREVIOUS%"
          echo "Current score: $CURRENT%"

          if [ "$CURRENT" -lt "$PREVIOUS" ]; then
            echo "::error::❌ Mutation score decreased from $PREVIOUS% to $CURRENT%"
            exit 1
          elif [ "$CURRENT" -gt "$PREVIOUS" ]; then
            echo "::notice::✅ Score improved from $PREVIOUS% to $CURRENT%"
          else
            echo "::notice::✅ Score maintained at $CURRENT%"
          fi

      - name: Save new score
        run: |
          mkdir -p .github
          echo "${{ steps.extract.outputs.score }}" > .github/mutation-score.txt
          
      - name: Commit score update
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .github/mutation-score.txt
          git diff --staged --quiet || git commit -m "📊 Update mutation score to ${{ steps.extract.outputs.score }}%"
          git push