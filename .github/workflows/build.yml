name: Build and Test
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [ 24, 25-ea ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
      - name: Cache Maven artifacts
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Cache node
        uses: actions/cache@v4
        with:
          path: web-bundle/node
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os}}-node-
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: web-bundle/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml', '**/package.json') }}
          restore-keys: |
            ${{ runner.os}}-node_modules-
      - name: Build ${{ matrix.java-version }}
        run: mvn -B clean test

# -----------------------------
# RUN MUTATION TESTS
# -----------------------------
      - name: Run mutation tests
        run: mvn -B org.pitest:pitest-maven:mutationCoverage

      - name: Extract mutation score
        id: pit
        run: |
          # extract score from PITest XML output
          SCORE=$(grep -oP '(?<=mutationCoverage=")\d+' target/pit-reports/*/mutations.xml | head -1)
          echo "score=$SCORE" >> $GITHUB_OUTPUT
          echo "Mutation score for this commit: $SCORE"

      # Download previous score artifact (if exists)
      - name: Download previous mutation score
        uses: actions/download-artifact@v4
        with:
          name: mutation-score
          path: previous
        continue-on-error: true

      - name: Compare scores
        run: |
          NEW=${{ steps.pit.outputs.score }}

          if [ -f previous/mutation_score.txt ]; then
            OLD=$(cat previous/mutation_score.txt)
            echo "Previous score: $OLD"
            echo "New score: $NEW"

            if [ "$NEW" -lt "$OLD" ]; then
              echo "❌ Mutation score decreased ($NEW < $OLD)"
              exit 1
            else
              echo "✅ Mutation score did not decrease"
            fi
          else
            echo "No previous score found — skipping comparison"
          fi

      # Upload the score for the next workflow run
      # First, create the file
      - name: Write mutation score to file
        run: | 
          echo "${{ steps.pit.outputs.score }}" > mutation_score.txt

      # Then, upload it
      - name: Upload mutation score
        uses: actions/upload-artifact@v4
        with:
          name: mutation-score
          path: mutation_score.txt
